<rect width="1200" height="627" fill="url(#bg)"/><rect width="1200" height="627" fill="url(#dots)"/>
<text x="48" y="66" font-size="31" font-weight="800" fill="#f3f6fb">Utility Bill Decoder</text>
<text x="48" y="94" font-size="16" fill="#8fa3bf">Pakistani electricity bill image  →  structured JSON  +  plain-English answers</text>
<rect x="48" y="262" width="190" height="112" rx="14" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.5"/><rect x="48" y="276" width="4" height="84" rx="2" fill="#fbbf24"/><text x="68" y="294" font-size="17" font-weight="700" fill="#f3f6fb">Bill image</text><text x="68" y="318" font-size="13" fill="#a9b8d0">K-Electric</text><text x="68" y="338" font-size="13" fill="#a9b8d0">LESCO · IESCO</text><text x="68" y="358" font-size="13" fill="#a9b8d0">PNG / JPG</text><text x="290" y="142" font-size="12" font-weight="700" letter-spacing="1.6" fill="#6b7c99" text-anchor="start">LEVEL 1 · EXTRACTION</text><text x="290" y="384" font-size="12" font-weight="700" letter-spacing="1.6" fill="#6b7c99" text-anchor="start">LEVEL 2 · QUESTION ANSWERING</text><rect x="290" y="156" width="190" height="96" rx="14" fill="#8b7cf6" fill-opacity="0.10" stroke="#8b7cf6" stroke-opacity="0.7" stroke-width="1.5"/><rect x="290" y="170" width="4" height="68" rx="2" fill="#8b7cf6"/><text x="310" y="188" font-size="17" font-weight="700" fill="#f3f6fb">Gemini extract</text><text x="310" y="212" font-size="13" fill="#a9b8d0">schema + detailed rules</text><text x="310" y="232" font-size="13" fill="#a9b8d0">returns JSON only</text><rect x="520" y="156" width="190" height="96" rx="14" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.5"/><rect x="520" y="170" width="4" height="68" rx="2" fill="#34d399"/><text x="540" y="188" font-size="17" font-weight="700" fill="#f3f6fb">clean()</text><text x="540" y="212" font-size="13" fill="#a9b8d0">54770CR → -54770</text><text x="540" y="232" font-size="13" fill="#a9b8d0">drop zero lines</text><rect x="750" y="156" width="190" height="96" rx="14" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.5"/><rect x="750" y="170" width="4" height="68" rx="2" fill="#34d399"/><text x="770" y="188" font-size="17" font-weight="700" fill="#f3f6fb">Safety net</text><text x="770" y="212" font-size="13" fill="#a9b8d0">3 retries per bill</text><text x="770" y="232" font-size="13" fill="#a9b8d0">null fallback</text><rect x="960" y="156" width="192" height="96" rx="14" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.5"/><rect x="960" y="170" width="4" height="68" rx="2" fill="#fbbf24"/><text x="980" y="188" font-size="17" font-weight="700" fill="#f3f6fb">level1.csv</text><text x="980" y="212" font-size="13" fill="#a9b8d0">one JSON per bill</text><path d="M484 204 L514 204" fill="none" stroke="#6b7c99" stroke-width="2" marker-end="url(#ar)"/><path d="M714 204 L744 204" fill="none" stroke="#6b7c99" stroke-width="2" marker-end="url(#ar)"/><path d="M944 204 L954 204" fill="none" stroke="#6b7c99" stroke-width="2" marker-end="url(#ar)"/><rect x="290" y="400" width="190" height="96" rx="14" fill="#8b7cf6" fill-opacity="0.10" stroke="#8b7cf6" stroke-opacity="0.7" stroke-width="1.5"/><rect x="290" y="414" width="4" height="68" rx="2" fill="#8b7cf6"/><text x="310" y="432" font-size="17" font-weight="700" fill="#f3f6fb">Gemini history</text><text x="310" y="456" font-size="13" fill="#a9b8d0">reads the usage</text><text x="310" y="476" font-size="13" fill="#a9b8d0">table: month, units</text><rect x="520" y="400" width="190" height="96" rx="14" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.5"/><rect x="520" y="414" width="4" height="68" rx="2" fill="#34d399"/><text x="540" y="432" font-size="17" font-weight="700" fill="#f3f6fb">compute_stats()</text><text x="540" y="456" font-size="13" fill="#a9b8d0">avg · max · min</text><text x="540" y="476" font-size="13" fill="#a9b8d0">all maths in Python</text><rect x="750" y="400" width="190" height="96" rx="14" fill="#8b7cf6" fill-opacity="0.10" stroke="#8b7cf6" stroke-opacity="0.7" stroke-width="1.5"/><rect x="750" y="414" width="4" height="68" rx="2" fill="#8b7cf6"/><text x="770" y="432" font-size="17" font-weight="700" fill="#f3f6fb">Gemini answers</text><text x="770" y="456" font-size="13" fill="#a9b8d0">12 questions, 1 call</text><text x="770" y="476" font-size="13" fill="#a9b8d0">grounded in the bill</text><rect x="960" y="400" width="192" height="96" rx="14" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.5"/><rect x="960" y="414" width="4" height="68" rx="2" fill="#fbbf24"/><text x="980" y="432" font-size="17" font-weight="700" fill="#f3f6fb">level2.csv</text><text x="980" y="456" font-size="13" fill="#a9b8d0">plain-English answers</text><path d="M484 448 L514 448" fill="none" stroke="#6b7c99" stroke-width="2" marker-end="url(#ar)"/><path d="M714 448 L744 448" fill="none" stroke="#6b7c99" stroke-width="2" marker-end="url(#ar)"/><path d="M944 448 L954 448" fill="none" stroke="#6b7c99" stroke-width="2" marker-end="url(#ar)"/><path d="M242 318 C 266 318 262 204 284 204" fill="none" stroke="#6b7c99" stroke-width="2" marker-end="url(#ar)"/><path d="M242 318 C 266 318 262 448 284 448" fill="none" stroke="#6b7c99" stroke-width="2" marker-end="url(#ar)"/><path d="M615 256 L615 335 L845 335 L845 394" fill="none" stroke="#6b7c99" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ar)"/><text x="627" y="328" font-size="12" fill="#6b7c99">Level 1 JSON reused</text><rect x="48" y="585" width="14" height="14" rx="4" fill="#8b7cf6"/><text x="70" y="596" font-size="13" fill="#a9b8d0">LLM (Gemini)</text><rect x="186.8" y="585" width="14" height="14" rx="4" fill="#34d399"/><text x="208.8" y="596" font-size="13" fill="#a9b8d0">Python</text><rect x="281.20000000000005" y="585" width="14" height="14" rx="4" fill="#fbbf24"/><text x="303.20000000000005" y="596" font-size="13" fill="#a9b8d0">Input / output</text><text x="1152" y="596" font-size="13" fill="#6b7c99" text-anchor="end">Utility Bill Decoder</text></svg>
