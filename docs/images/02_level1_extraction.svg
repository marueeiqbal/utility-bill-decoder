<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101a33"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7c99"/></marker>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.05"/></pattern>
</defs>
<rect width="1200" height="627" fill="url(#bg)"/><rect width="1200" height="627" fill="url(#dots)"/>
<text x="48" y="66" font-size="31" font-weight="800" fill="#f3f6fb">Level 1: messy bill → clean JSON</text>
<text x="48" y="94" font-size="16" fill="#8fa3bf">One image in, 18 fixed fields out. Never guess, use null when unreadable.</text>
<rect x="48" y="128" width="290" height="330" rx="12" fill="#f4f6fa"/><rect x="48" y="128" width="290" height="44" rx="12" fill="#d9dfeb"/><rect x="48" y="158" width="290" height="14" fill="#d9dfeb"/><text x="64" y="156" font-size="14" font-weight="800" fill="#33415c">ELECTRICITY BILL</text><text x="66" y="206" font-size="13" fill="#52607a">Tariff</text><text x="320" y="206" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="end" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">A1-R</text><text x="66" y="232" font-size="13" fill="#52607a">Units</text><text x="320" y="232" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="end" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">159</text><text x="66" y="258" font-size="13" fill="#52607a">Energy</text><text x="320" y="258" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="end" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">4,596.69</text><text x="66" y="284" font-size="13" fill="#52607a">QTA</text><text x="320" y="284" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="end" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">274.99CR</text><text x="66" y="310" font-size="13" fill="#52607a">GST</text><text x="320" y="310" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="end" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">1,159.40</text><text x="66" y="336" font-size="13" fill="#52607a">Arrears</text><text x="320" y="336" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="end" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">0.41CR</text><rect x="66" y="372" width="254" height="26" rx="4" fill="#aab3c4"/><text x="193.0" y="390" font-size="11" fill="#eef1f6" text-anchor="middle">grey box → null</text><rect x="66" y="410" width="254" height="30" rx="4" fill="#e1e6f0"/><text x="193.0" y="430" font-size="11" fill="#52607a" text-anchor="middle">history table (Level 2)</text><path d="M346 293 L 392 293" fill="none" stroke="#6b7c99" stroke-width="2" marker-end="url(#ar)"/><rect x="400" y="128" width="380" height="330" rx="14" fill="#8b7cf6" fill-opacity="0.10" stroke="#8b7cf6" stroke-opacity="0.7" stroke-width="1.5"/><rect x="400" y="142" width="4" height="302" rx="2" fill="#8b7cf6"/><text x="420" y="160" font-size="17" font-weight="700" fill="#f3f6fb">Gemini + prompt rules</text><circle cx="430" cy="180" r="9" fill="#8b7cf6" fill-opacity="0.25"/><text x="430" y="184" font-size="11" font-weight="800" fill="#8b7cf6" text-anchor="middle">1</text><text x="451" y="184" font-size="14" fill="#c9d4e6">Copy values as printed, no recalculating</text><circle cx="430" cy="216" r="9" fill="#8b7cf6" fill-opacity="0.25"/><text x="430" y="220" font-size="11" font-weight="800" fill="#8b7cf6" text-anchor="middle">2</text><text x="451" y="220" font-size="14" fill="#c9d4e6">Credits (CR) and subsidies are negative</text><circle cx="430" cy="252" r="9" fill="#8b7cf6" fill-opacity="0.25"/><text x="430" y="256" font-size="11" font-weight="800" fill="#8b7cf6" text-anchor="middle">3</text><text x="451" y="256" font-size="14" fill="#c9d4e6">Classify charges &amp; taxes by SECTION</text><circle cx="430" cy="288" r="9" fill="#8b7cf6" fill-opacity="0.25"/><text x="430" y="292" font-size="11" font-weight="800" fill="#8b7cf6" text-anchor="middle">4</text><text x="451" y="292" font-size="14" fill="#c9d4e6">KE: add Off Peak + Peak registers</text><circle cx="430" cy="324" r="9" fill="#8b7cf6" fill-opacity="0.25"/><text x="430" y="328" font-size="11" font-weight="800" fill="#8b7cf6" text-anchor="middle">5</text><text x="451" y="328" font-size="14" fill="#c9d4e6">LESCO/IESCO: never add registers</text><circle cx="430" cy="360" r="9" fill="#8b7cf6" fill-opacity="0.25"/><text x="430" y="364" font-size="11" font-weight="800" fill="#8b7cf6" text-anchor="middle">6</text><text x="451" y="364" font-size="14" fill="#c9d4e6">Several late amounts: use the highest</text><circle cx="430" cy="396" r="9" fill="#8b7cf6" fill-opacity="0.25"/><text x="430" y="400" font-size="11" font-weight="800" fill="#8b7cf6" text-anchor="middle">7</text><text x="451" y="400" font-size="14" fill="#c9d4e6">No names, addresses, CNIC, meter IDs</text><path d="M788 293 L 832 293" fill="none" stroke="#6b7c99" stroke-width="2" marker-end="url(#ar)"/><rect x="840" y="128" width="312" height="330" rx="14" fill="#0a0f1c" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="1.5"/><text x="858" y="158.0" font-size="12" fill="#d6e0f0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" xml:space="preserve">{</text><text x="858" y="180.5" font-size="12" fill="#d6e0f0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" xml:space="preserve">  "provider": "KE",</text><text x="858" y="203.0" font-size="12" fill="#d6e0f0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" xml:space="preserve">  "tariff": "A1-R",</text><text x="858" y="225.5" font-size="12" fill="#d6e0f0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" xml:space="preserve">  "units_consumed": 159,</text><text x="858" y="248.0" font-size="12" fill="#d6e0f0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" xml:space="preserve">  "charges": [</text><text x="858" y="270.5" font-size="12" fill="#d6e0f0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" xml:space="preserve">    {"type": "fixed", "amount": 900},</text><text x="858" y="293.0" font-size="12" fill="#d6e0f0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" xml:space="preserve">    {"type": "energy", "amount": 4596.69},</text><text x="858" y="315.5" font-size="12" fill="#d6e0f0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" xml:space="preserve">    {"type": "quarterly_adjustment",</text><text x="858" y="338.0" font-size="12" fill="#d6e0f0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" xml:space="preserve">     "amount": -274.99}</text><text x="858" y="360.5" font-size="12" fill="#d6e0f0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" xml:space="preserve">  ],</text><text x="858" y="383.0" font-size="12" fill="#d6e0f0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" xml:space="preserve">  "total_taxes": 1261.29,</text><text x="858" y="405.5" font-size="12" fill="#d6e0f0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" xml:space="preserve">  "arrears": -0.41,</text><text x="858" y="428.0" font-size="12" fill="#d6e0f0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" xml:space="preserve">  "current_bill": 7620.53</text><text x="858" y="450.5" font-size="12" fill="#d6e0f0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" xml:space="preserve">}</text><text x="48" y="496" font-size="12" font-weight="700" letter-spacing="1.6" fill="#34d399" text-anchor="start">clean(): PYTHON SAFETY NET AFTER EVERY CALL</text><rect x="48.0" y="510" width="268" height="56" rx="12" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.6"/><text x="70.0" y="544" font-size="15" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">"54770CR"</text><text x="188.0" y="544" font-size="16" fill="#34d399" font-weight="700">→</text><text x="216.0" y="544" font-size="15" font-weight="700" fill="#f3f6fb" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">-54770</text><rect x="326.67" y="510" width="268" height="56" rx="12" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.6"/><text x="348.67" y="544" font-size="15" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">"1,234.5"</text><text x="466.67" y="544" font-size="16" fill="#34d399" font-weight="700">→</text><text x="494.67" y="544" font-size="15" font-weight="700" fill="#f3f6fb" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">1234.5</text><rect x="605.34" y="510" width="268" height="56" rx="12" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.6"/><text x="627.34" y="544" font-size="15" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">amount: 0</text><text x="745.34" y="544" font-size="16" fill="#34d399" font-weight="700">→</text><text x="773.34" y="544" font-size="15" font-weight="700" fill="#f3f6fb" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">dropped</text><rect x="884.01" y="510" width="268" height="56" rx="12" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.6"/><text x="906.01" y="544" font-size="15" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">missing key</text><text x="1024.01" y="544" font-size="16" fill="#34d399" font-weight="700">→</text><text x="1052.01" y="544" font-size="15" font-weight="700" fill="#f3f6fb" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">null</text><rect x="48" y="585" width="14" height="14" rx="4" fill="#8b7cf6"/><text x="70" y="596" font-size="13" fill="#a9b8d0">LLM (Gemini)</text><rect x="186.8" y="585" width="14" height="14" rx="4" fill="#34d399"/><text x="208.8" y="596" font-size="13" fill="#a9b8d0">Python</text><rect x="281.20000000000005" y="585" width="14" height="14" rx="4" fill="#fbbf24"/><text x="303.20000000000005" y="596" font-size="13" fill="#a9b8d0">Input / output</text><text x="1152" y="596" font-size="13" fill="#6b7c99" text-anchor="end">Utility Bill Decoder</text></svg>
