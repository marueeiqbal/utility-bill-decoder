<text x="48" y="66" font-size="31" font-weight="800" fill="#f3f6fb">Level 2: LLM reads. Python calculates. LLM explains.</text>
<text x="48" y="94" font-size="16" fill="#8fa3bf">Language models are great at reading and wording, and unreliable at arithmetic. So the maths is not theirs.</text>
<rect x="48" y="128" width="350" height="300" rx="16" fill="#8b7cf6" fill-opacity="0.08" stroke="#8b7cf6" stroke-opacity="0.65" stroke-width="1.5"/><text x="70" y="162" font-size="13" font-weight="700" letter-spacing="1.6" fill="#8b7cf6" text-anchor="start">1  READ</text><text x="70" y="186" font-size="16" font-weight="700" fill="#f3f6fb">Gemini · history table</text><rect x="423" y="128" width="350" height="300" rx="16" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.65" stroke-width="1.5"/><text x="445" y="162" font-size="13" font-weight="700" letter-spacing="1.6" fill="#34d399" text-anchor="start">2  CALCULATE</text><text x="445" y="186" font-size="16" font-weight="700" fill="#f3f6fb">Python · compute_stats()</text><rect x="798" y="128" width="350" height="300" rx="16" fill="#8b7cf6" fill-opacity="0.08" stroke="#8b7cf6" stroke-opacity="0.65" stroke-width="1.5"/><text x="820" y="162" font-size="13" font-weight="700" letter-spacing="1.6" fill="#8b7cf6" text-anchor="start">3  EXPLAIN</text><text x="820" y="186" font-size="16" font-weight="700" fill="#f3f6fb">Gemini · answers</text><text x="70" y="220" font-size="12" fill="#8fa3bf">month</text><text x="220" y="220" font-size="12" fill="#8fa3bf">units</text><text x="300" y="220" font-size="12" fill="#8fa3bf">amount</text><line x1="70" y1="230" x2="370" y2="230" stroke="#ffffff" stroke-opacity="0.07"/><text x="70" y="248" font-size="14" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">2025-10</text><text x="220" y="248" font-size="14" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">656</text><text x="300" y="248" font-size="14" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">null</text><line x1="70" y1="258" x2="370" y2="258" stroke="#ffffff" stroke-opacity="0.07"/><text x="70" y="276" font-size="14" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">2025-11</text><text x="220" y="276" font-size="14" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">412</text><text x="300" y="276" font-size="14" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">21,090</text><line x1="70" y1="286" x2="370" y2="286" stroke="#ffffff" stroke-opacity="0.07"/><text x="70" y="304" font-size="14" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">2025-12</text><text x="220" y="304" font-size="14" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">301</text><text x="300" y="304" font-size="14" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">15,880</text><line x1="70" y1="314" x2="370" y2="314" stroke="#ffffff" stroke-opacity="0.07"/><text x="70" y="332" font-size="14" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">2026-01</text><text x="220" y="332" font-size="14" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">264</text><text x="300" y="332" font-size="14" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">13,210</text><line x1="70" y1="342" x2="370" y2="342" stroke="#ffffff" stroke-opacity="0.07"/><text x="70" y="360" font-size="14" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">…</text><text x="220" y="360" font-size="14" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">…</text><text x="300" y="360" font-size="14" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace">…</text><text x="70" y="410" font-size="12.5" fill="#8fa3bf">Illustrative rows. Unreadable cell? null.</text><text x="445" y="216" font-size="13.5" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace"><tspan fill="#34d399">▸</tspan> average_units</text><text x="445" y="242" font-size="13.5" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace"><tspan fill="#34d399">▸</tspan> max_units / min_units</text><text x="445" y="268" font-size="13.5" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace"><tspan fill="#34d399">▸</tspan> months_above_100 / 200 / 300</text><text x="445" y="294" font-size="13.5" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace"><tspan fill="#34d399">▸</tspan> summer_avg − winter_avg</text><text x="445" y="320" font-size="13.5" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace"><tspan fill="#34d399">▸</tspan> taxes_percent_of_current_bill</text><text x="445" y="346" font-size="13.5" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace"><tspan fill="#34d399">▸</tspan> current_bill_per_unit</text><text x="445" y="372" font-size="13.5" fill="#c9d4e6" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace"><tspan fill="#34d399">▸</tspan> estimate_bill_same_units</text><text x="445" y="416" font-size="12.5" fill="#8fa3bf">Deterministic. Same input, same numbers.</text><text x="820" y="220" font-size="14" fill="#c9d4e6"><tspan fill="#8b7cf6" font-weight="800">✓</tspan> Use ONLY what is on the bill</text><text x="820" y="250" font-size="14" fill="#c9d4e6"><tspan fill="#8b7cf6" font-weight="800">✓</tspan> Use the computed numbers exactly</text><text x="820" y="280" font-size="14" fill="#c9d4e6"><tspan fill="#8b7cf6" font-weight="800">✓</tspan> Number first, then short context</text><text x="820" y="310" font-size="14" fill="#c9d4e6"><tspan fill="#8b7cf6" font-weight="800">✓</tspan> Label estimates as ESTIMATE</text><text x="820" y="340" font-size="14" fill="#c9d4e6"><tspan fill="#8b7cf6" font-weight="800">✓</tspan> Say so when the bill does not show it</text><text x="820" y="370" font-size="14" fill="#c9d4e6"><tspan fill="#8b7cf6" font-weight="800">✓</tspan> Ambiguous? State the meaning used</text><text x="820" y="410" font-size="12.5" fill="#8fa3bf">All 12 questions answered in one call.</text><path d="M401 278.0 L420 278.0" fill="none" stroke="#6b7c99" stroke-width="2" marker-end="url(#ar)"/><path d="M776 278.0 L795 278.0" fill="none" stroke="#6b7c99" stroke-width="2" marker-end="url(#ar)"/><text x="48" y="456" font-size="12" font-weight="700" letter-spacing="1.6" fill="#6b7c99" text-anchor="start">REAL OUTPUT FROM THIS REPO</text><rect x="48" y="470" width="1104" height="100" rx="14" fill="#0a0f1c" stroke="#ffffff" stroke-opacity="0.1"/><text x="72" y="502" font-size="12" font-weight="700" letter-spacing="1.4" fill="#60a5fa">Q</text><text x="100" y="502" font-size="15" fill="#c9d4e6">Which month in the last 12 months had the highest units consumed?</text><text x="72" y="538" font-size="12" font-weight="700" letter-spacing="1.4" fill="#34d399">A</text><text x="100" y="538" font-size="15" fill="#f3f6fb">656 units were consumed in October 2025, which is the highest in the 11-month history provided.</text><rect x="48" y="585" width="14" height="14" rx="4" fill="#8b7cf6"/><text x="70" y="596" font-size="13" fill="#a9b8d0">LLM (Gemini)</text><rect x="186.8" y="585" width="14" height="14" rx="4" fill="#34d399"/><text x="208.8" y="596" font-size="13" fill="#a9b8d0">Python</text><rect x="281.20000000000005" y="585" width="14" height="14" rx="4" fill="#fbbf24"/><text x="303.20000000000005" y="596" font-size="13" fill="#a9b8d0">Input / output</text><text x="1152" y="596" font-size="13" fill="#6b7c99" text-anchor="end">Utility Bill Decoder</text></svg>
